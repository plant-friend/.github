name: Task
description: A concrete piece of work one person can finish in 1–3 days.
title: "[Task] "
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Protocol
        - Firmware
        - Backend
        - Web
        - Hardware
        - Docs
        - DevOps
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What needs to be done?
      description: 1–3 sentences. If you need more, it is probably an epic.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must the result do? Checkable points that apply only to this task.
      value: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes, links, dependencies
      description: Optional. Related issues, data sheets, ideas for the solution.